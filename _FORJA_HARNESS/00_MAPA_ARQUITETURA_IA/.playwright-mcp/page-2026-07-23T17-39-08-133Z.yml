    - generic [ref=e188]:
      - generic [ref=e189]:
        - heading "O cardápio completo — o que dá para pedir ao sistema" [level=3] [ref=e192]
        - list [ref=e193]:
          - listitem [ref=e194]: "• Cuidar do acervo: conferir a saúde do banco, migrar dados antigos sem duplicar, auditar integridade e literalidade das provas, e montar o dossiê completo de um processo pelo número nacional único."
          - listitem [ref=e195]: "• Buscar fora: pesquisar de uma vez no acervo, nas fontes oficiais e na web; coletar processos por tribunal; consultar acórdãos, decisões diárias e catálogos do Superior Tribunal de Justiça; atualizar o espelho local das listas de sanções do governo federal."
          - listitem [ref=e196]: "• Investigar fundo: planejar uma missão de pesquisa sem gastar nada, executá-la com registro de cada etapa e retomá-la depois; enriquecer as partes do processo com evidência oficial arquivada."
          - listitem [ref=e197]: "• Classificar e provar: dar nota de chance de reversão a cada processo, classificar somente documentos conferidos pelo selo digital, preparar a fila de revisão e aplicar as decisões assinadas pelo revisor humano."
          - listitem [ref=e198]: "• Entregar: gerar painel visual, ranking em planilha e relatório de alvos — sempre recriados a partir do estado validado do acervo, nunca editados à mão."
          - listitem [ref=e199]: "• Proteger: importar e inventariar chaves de acesso no cofre, validar cópias de segurança, executar os vigias das fontes externas e medir a capacidade de resolver desafios de acesso dos portais."
      - generic [ref=e200]:
        - heading "As fontes consultadas — quem responde o quê" [level=3] [ref=e203]
        - list [ref=e204]:
          - listitem [ref=e205]: "• Acervo local: a fonte canônica do que já foi coletado e provado — responde primeiro e de graça."
          - listitem [ref=e206]: "• Governo federal (controladoria): cinco listas oficiais de empresas e pessoas sancionadas, espelhadas localmente com data e selo — ausência na lista não é certidão de idoneidade."
          - listitem [ref=e207]: "• Superior Tribunal de Justiça: espelhos oficiais de acórdãos de dez órgãos julgadores, decisões do diário e catálogo de dados abertos — espelho não substitui a íntegra."
          - listitem [ref=e208]: "• Conselho Nacional de Justiça: descoberta nacional de processos e seus metadados — não entrega valor de condenação nem o inteiro teor da decisão."
          - listitem [ref=e209]: "• Senado Federal: metadados oficiais de leis e normas — vigência e consolidação sempre conferidas."
          - listitem [ref=e210]: "• Tribunais específicos: consulta de valor em Brasília, navegação assistida na Justiça Federal da 1ª Região e garimpo nos portais de São Paulo e Minas Gerais."
          - listitem [ref=e211]: "• Web e serviços comerciais: buscadores gratuitos em modo estrito e serviços pagos opcionais — descobrem pistas, nunca promovem prova oficial, e só rodam com autorização e teto de gasto."
      - generic [ref=e212]:
        - heading "As travas — onde o sistema para sozinho" [level=3] [ref=e215]
        - list [ref=e216]:
          - listitem [ref=e217]: • Fonte paga sem autorização expressa ou sem estimativa de gasto dentro do teto → a chamada é bloqueada antes de sair do computador.
          - listitem [ref=e218]: • Pedido de leitura com banco ausente → falha na hora, em vez de criar silenciosamente um banco vazio e responder que não há nada.
          - listitem [ref=e219]: • Dois processos tentando gravar ao mesmo tempo → apenas um escreve; o outro espera, para o acervo nunca se corromper.
          - listitem [ref=e220]: • Caso de alto valor sem decisão de revisor humano identificado → permanece na fila; hoje há 72 esperando, e nenhum programa pode fechá-los.
          - listitem [ref=e221]: • Nova coleta encontra versão mais fraca de uma prova já confirmada → a versão forte é preservada; evidência nunca é rebaixada.
          - listitem [ref=e222]: • Cópia de segurança sem ensaio real de restauração aprovado → o pacote não é promovido a backup válido.
          - listitem [ref=e223]: • A fábrica de petições pede uma mudança no acervo → além do pedido, precisa apresentar autorização externa própria para mudanças.
      - generic [ref=e224]:
        - heading "Quem faz o quê — pessoas, agentes e a fábrica de petições" [level=3] [ref=e227]
        - list [ref=e228]:
          - listitem [ref=e229]: "• O operador humano usa o balcão de comandos: 28 pedidos possíveis, cada um com nome, descrição e resultado previsível."
          - listitem [ref=e230]: "• A fábrica de petições (e qualquer outro agente de inteligência artificial) usa o balcão de dados: 31 ações de lista fechada, com envelope padronizado — jamais comandos livres no computador."
          - listitem [ref=e231]: "• O revisor humano é insubstituível no ponto mais sensível: promover um caso de alto valor exige nome do revisor, documento com selo digital coerente e o trecho literal da decisão que sustenta o valor."
          - listitem [ref=e232]: "• O sistema declara os próprios limites: só 8,76% do acervo tem nota até agora, e ausência de resultado nunca é tratada como prova de que algo não existe juridicamente."
          - listitem [ref=e233]: "• Tudo o que muda o acervo fica registrado: qual pedido, quando, o que gravou e com que resultado — a trilha permite auditar depois."
      - generic [ref=e234]:
        - heading "A linha especializada de improbidade administrativa" [level=3] [ref=e237]
        - list [ref=e238]:
          - listitem [ref=e239]: "• Garimpo: varre os diários e portais dos tribunais de São Paulo e Minas Gerais atrás de condenações por improbidade, e depois confirma cada achado."
          - listitem [ref=e240]: "• Enriquecimento: completa cada processo confirmado com partes, fase atual e documentos, usando rota alternativa quando o portal principal falha."
          - listitem [ref=e241]: "• Valor da condenação: coletores dedicados buscam o valor no tribunal de Brasília e na Justiça Federal da 1ª Região — valor citado sem documento âncora fica marcado como pista, não como fato."
          - listitem [ref=e242]: "• Painel: uma visão única mostra o funil inteiro — quantos achados, quantos confirmados, quantos enriquecidos e quantos com valor provado."
          - listitem [ref=e243]: • Oito comandos próprios formam essa linha; os roteiros antigos e avulsos foram aposentados e guardados numa etiqueta de resgate no histórico.
      - generic [ref=e244]:
        - heading "Correspondência técnica — único lugar com códigos, para quem for aos documentos internos" [level=3] [ref=e247]
        - list [ref=e248]:
          - listitem [ref=e249]: "• O sistema se chama TeiaJus: um pacote Python local com banco SQLite (arquivo teiajus.db, esquema versão 4) — o balcão de comandos é a CLI `python -m teiajus` (28 subcomandos) e o balcão de dados é a API JSON v1 (31 ações em allowlist)."
          - listitem [ref=e250]: "• Selo digital = hash SHA-256: a impressão digital única de cada documento, que prova que nada mudou depois da conferência; 2.155 de 2.155 documentos do corpus têm selo e linhagem."
          - listitem [ref=e251]: "• Os vigias externos = canários: verificações isoladas das fontes de fora (na última rodada, 4 de 5 prontos; a consulta nacional do CNJ estourou o tempo limite)."
          - listitem [ref=e252]: "• Fontes citadas nos textos internos: DataJud (CNJ), listas CEIS/CNEP/CEPIM/CEAF e leniência (CGU), espelhos CKAN do STJ, API do TJDFT, navegação PJe no TRF1, portais e-SAJ (TJSP) e TJMG."
          - listitem [ref=e253]: "• As regras de gravação = WAL, chaves estrangeiras e trava de escritor único entre processos; a linha de improbidade vive em `teiajus.verticals.improbidade`; a fila de decisão humana é o gate de evidência com 72 pendências."

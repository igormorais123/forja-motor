    - generic [ref=e184]:
      - generic [ref=e185]:
        - heading "Consultar e cuidar do acervo — dez pedidos, um a um" [level=3] [ref=e188]
        - list [ref=e189]:
          - listitem [ref=e190]: "• Conferir a saúde do banco: integridade, contagens, lacunas e estado de recuperação (comando `saude`)."
          - listitem [ref=e191]: "• Montar o dossiê completo de um processo pelo número nacional único (ação `get_case`, pelo balcão de agentes)."
          - listitem [ref=e192]: "• Buscar casos no acervo com filtros estruturados de tribunal, tema e situação (ação `search_cases`, pelo balcão de agentes)."
          - listitem [ref=e193]: "• Auditar integridade, literalidade das provas e uma amostra conferida ao vivo contra a fonte real (comando `auditar`)."
          - listitem [ref=e194]: "• Migrar dados de tabelas antigas sem duplicar nem perder nada, repetível com segurança (comando `migrar`)."
          - listitem [ref=e195]: "• Ver o catálogo de fontes de pesquisa e a política de custo de cada uma (comando `fontes`)."
          - listitem [ref=e196]: "• Ver o estado do portão de evidência: quantos casos aguardam revisão humana e por quê (comando `evidencia-status`)."
          - listitem [ref=e197]: "• Ver datas, selos e contagens do espelho local de sanções do governo federal (comando `cgu-status`)."
          - listitem [ref=e198]: "• Medir a capacidade de resolver desafios de acesso dos portais e o saldo do serviço (comando `captcha-status`)."
          - listitem [ref=e199]: "• Inventariar as chaves guardadas no cofre, sem nunca exibir os valores (comando `segredos-status`)."
      - generic [ref=e200]:
        - heading "Buscar fora e coletar — doze pedidos, um a um" [level=3] [ref=e203]
        - list [ref=e204]:
          - listitem [ref=e205]: "• Perguntar de uma vez ao acervo, às fontes oficiais e à web, com teto de gasto e relatório único (comando `pesquisar`)."
          - listitem [ref=e206]: "• Executar uma missão de pesquisa autônoma e persistente, que pode ser retomada de onde parou (comando `missao`); planejar a missão sem gastar nada (ação `research_plan`) e recuperar a trilha completa depois (ação `research_mission_get`)."
          - listitem [ref=e207]: "• Descobrir processos novos por tribunal na base nacional do Conselho Nacional de Justiça (comando `coletar`)."
          - listitem [ref=e208]: "• Enriquecer as partes de cada processo com evidência oficial arquivada (comando `partes`)."
          - listitem [ref=e209]: "• Pesquisar acórdãos nos espelhos oficiais de dez órgãos julgadores do Superior Tribunal de Justiça (comando `stj-buscar`)."
          - listitem [ref=e210]: "• Acompanhar as decisões e acórdãos publicados no dia, com a íntegra oficial opcional (comando `stj-diario`)."
          - listitem [ref=e211]: "• Espiar a situação processual de um caso no Superior Tribunal sem gravar nada (comando `stj-datajud`)."
          - listitem [ref=e212]: "• Listar todos os conjuntos de dados abertos oficiais do Superior Tribunal (comando `stj-catalogo`) e conferir se essas fontes estão no ar e atualizadas (comando `stj-saude`)."
          - listitem [ref=e213]: "• Gravar no acervo canônico os processos coletados do Superior Tribunal (ação `stj_collect`, pelo balcão de agentes)."
          - listitem [ref=e214]: "• Atualizar o espelho local das cinco listas federais de sancionados e acordos de leniência (comando `cgu-atualizar`)."
          - listitem [ref=e215]: "• Consultar o catálogo oficial de rotas do Portal da Transparência (comando `cgu-catalogo`)."
          - listitem [ref=e216]: "• Rodar os vigias externos: testes isolados de cada fonte de fora, sem tocar no acervo (comando `canarios`)."
      - generic [ref=e217]:
        - heading "Classificar, provar e entregar — oito pedidos, um a um" [level=3] [ref=e220]
        - list [ref=e221]:
          - listitem [ref=e222]: "• Dar nota de chance de reversão e classe de valor a cada processo do acervo (comando `classificar`)."
          - listitem [ref=e223]: "• Classificar somente documentos locais já conferidos pelo selo digital — nada de nota sem lastro (comando `classificar-documentos`)."
          - listitem [ref=e224]: "• Preparar a fila de revisão humana dos casos de alto valor, com tudo o que o revisor precisa ver (comando `evidencia-preparar`)."
          - listitem [ref=e225]: "• Aplicar as decisões assinadas pelo revisor humano, numa gravação única e íntegra (comando `evidencia-aplicar`)."
          - listitem [ref=e226]: "• Converter os caminhos internos das provas para um formato restaurável em outro computador (comando `documentos-portabilizar`)."
          - listitem [ref=e227]: "• Exportar o ranking de alvos em planilha, pronto para o trabalho do escritório (comando `ranking`)."
          - listitem [ref=e228]: "• Validar um pacote de cópia de segurança: selos, bancos e integridade (comando `restauracao-validar`)."
          - listitem [ref=e229]: "• Importar chaves de acesso para o cofre, aceitando apenas as da lista permitida (comando `segredos-importar`)."
      - generic [ref=e230]:
        - heading "Só pelo balcão de agentes — mais sete ações, além das já citadas" [level=3] [ref=e233]
        - list [ref=e234]:
          - listitem [ref=e235]: "• Perguntar ao sistema o que ele sabe fazer: recursos, políticas e limites vigentes (ação `capabilities`)."
          - listitem [ref=e236]: "• Gerar o painel visual e a planilha de alvos diretamente do estado validado (ação `report`)."
          - listitem [ref=e237]: "• Coletar o valor da condenação no tribunal de Brasília, com documento âncora (ação `collect_value_tjdft`)."
          - listitem [ref=e238]: "• Coletar o valor da condenação na Justiça Federal da 1ª Região, com navegação assistida (ação `collect_value_trf1`)."
          - listitem [ref=e239]: "• Resolver um desafio de acesso de imagem: primeiro leitura local gratuita, depois serviço pago se autorizado (ação `captcha_solve`)."
          - listitem [ref=e240]: "• Levantar contatos institucionais públicos em sites de empresas — nunca dados pessoais enriquecidos (ação `apify_contact_enrich`, paga e sob teto)."
          - listitem [ref=e241]: "• Regra geral do balcão de agentes: envelope padronizado, lista fechada de 31 ações, nada de comando livre; mudança no acervo pedida pela fábrica de petições exige autorização externa própria."
      - generic [ref=e242]:
        - heading "A linha de improbidade — oito comandos, um a um" [level=3] [ref=e245]
        - list [ref=e246]:
          - listitem [ref=e247]: "• Garimpar condenações por improbidade no diário oficial do tribunal de São Paulo (comando `garimpo-cjpg`)."
          - listitem [ref=e248]: "• Garimpar condenações no portal do tribunal de Minas Gerais (comando `garimpo-tjmg`)."
          - listitem [ref=e249]: "• Confirmar cada achado bruto do garimpo antes de aceitá-lo como caso real (comando `garimpo-confirmar`)."
          - listitem [ref=e250]: "• Enriquecer os casos confirmados com partes, fase atual e documentos (comando `enriquecer`)."
          - listitem [ref=e251]: "• Buscar a fase processual por rota alternativa quando o portal principal falha (comando `fase-fallback`)."
          - listitem [ref=e252]: "• Ver o funil inteiro num painel: achados, confirmados, enriquecidos e com valor provado (comando `painel`)."
          - listitem [ref=e253]: "• Coletar o valor da condenação em Brasília (comando `valor-tjdft`) e na Justiça Federal da 1ª Região (comando `valor-trf1`)."
          - listitem [ref=e254]: • Os roteiros antigos e avulsos dessa linha foram aposentados; ficaram guardados numa etiqueta de resgate no histórico, recuperáveis se algum dia forem necessários.
      - generic [ref=e255]:
        - heading "Como ler o cardápio — modos, políticas e totais" [level=3] [ref=e258]
        - list [ref=e259]:
          - listitem [ref=e260]: "• Todo pedido tem um modo declarado: leitura (só consulta, nunca muda o acervo) ou escrita (muda o acervo, sempre com trilha do que gravou)."
          - listitem [ref=e261]: • Todo pedido declara se usa a internet ou não; o que roda sem rede funciona até offline, direto no acervo local.
          - listitem [ref=e262]: "• Pedidos pagos são minoria e nunca rodam sozinhos: missão de pesquisa, resolução paga de desafios de acesso e busca de contatos exigem autorização expressa e estimativa dentro do teto de gasto — sem isso, a chamada é barrada antes de sair do computador."
          - listitem [ref=e263]: "• Os totais de hoje: 28 comandos no balcão humano, 31 ações no balcão de agentes (20 compartilhadas com a linha de comando e 11 exclusivas) e 8 comandos na linha de improbidade."
          - listitem [ref=e264]: "• Fotografia do acervo na última revisão: 33.591 processos, 8.477 partes, 2.155 documentos com selo digital (100% do corpus), 32.619 registros de sanções e 72 decisões de alto valor aguardando revisor humano."
          - listitem [ref=e265]: • Este cardápio nasce de uma matriz gerada automaticamente pelo próprio sistema — quando um comando muda, a matriz muda junto; a fonte técnica é a tabela de interfaces em CAPACIDADES_ATUAIS.md.

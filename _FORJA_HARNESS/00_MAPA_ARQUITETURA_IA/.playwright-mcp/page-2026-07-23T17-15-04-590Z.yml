    - generic [ref=e192]:
      - generic [ref=e193]:
        - heading "Os guardiões automáticos — programas reais que vigiam cada etapa" [level=3] [ref=e196]
        - list [ref=e197]:
          - listitem [ref=e198]: "• Caçador de texto malicioso (na leitura dos documentos): procura letras invisíveis, fonte minúscula e frases que tentem dar ordens à inteligência artificial; qualquer achado para a linha e vai para triagem humana."
          - listitem [ref=e199]: "• Explorador de cem perguntas: garante que o caso foi examinado por dez ângulos — objetivo do cliente, caminho processual, fatos e provas, leis aplicáveis, repercussão, riscos, prazos, tendência dos julgadores, argumentos do adversário e blindagem contra recursos."
          - listitem [ref=e200]: "• Conferente de citações: compara cada lei, súmula e decisão citada, palavra por palavra, com a fonte oficial, arquivada com a data da conferência."
          - listitem [ref=e201]: "• Contador duplo de prazos: o mesmo prazo é contado duas vezes, por conferentes separados; divergência precisa ser resolvida e registrada por escrito antes de liberar a peça."
          - listitem [ref=e202]: "• Conferente de fidelidade da revisão final: compara o texto antes e depois da revisão de escrita; se número, data, citação, pedido ou ressalva mudou, a versão é descartada e refeita."
          - listitem [ref=e203]: "• Inspetor do documento final: procura campos esquecidos (como um nome entre colchetes), texto invisível e vestígios técnicos escondidos nos bastidores do arquivo; confere que a aparência segue o padrão do escritório."
          - listitem [ref=e204]: "• Comparador pós-entrega: mede as diferenças entre a versão que enviamos e a que foi protocolada, e transforma cada diferença em lição registrada para os próximos casos."
      - generic [ref=e205]:
        - heading "Onde o sistema trava sozinho — e o que destrava" [level=3] [ref=e208]
        - list [ref=e209]:
          - listitem [ref=e210]: • Falta prova para um fato essencial → a redação não começa; a pendência vira pedido de diligência com responsável nomeado.
          - listitem [ref=e211]: • Citação não confere com a fonte oficial → é corrigida, transformada em paráfrase declarada ou retirada antes de seguir.
          - listitem [ref=e212]: • A auditoria encontra um erro grave (fato alterado, citação falsa, autoridade trocada, pedido faltando) → a peça volta; só segue com zero erros graves comprovados.
          - listitem [ref=e213]: • A revisão de escrita tocou no conteúdo → a versão é descartada e refeita a partir do texto auditado, quantas vezes for preciso.
          - listitem [ref=e214]: • Página com defeito visual ou campo esquecido → a entrega espera a correção e uma nova inspeção completa de todas as páginas.
          - listitem [ref=e215]: • Sem prova de entrega e sem o painel de demandas atualizado → o caso não fecha e a demanda continua aberta.
      - generic [ref=e216]:
        - heading "Quem faz o quê — pessoas e inteligências artificiais, sem disfarce" [level=3] [ref=e219]
        - list [ref=e220]:
          - listitem [ref=e221]: "• A inteligência artificial faz o trabalho pesado: lê os autos, pesquisa fontes, redige a minuta, audita citações e inspeciona páginas — sempre dentro de trilhos, com registro de cada passo."
          - listitem [ref=e222]: • Helena e Cícero são conselheiros de inteligência artificial especializados (estratégia e direito). Os pareceres deles são escritos e obrigatórios; cada recomendação recebe resposta registrada — acatada ou rejeitada e por quê.
          - listitem [ref=e223]: "• Quem produz nunca é quem revisa: a auditoria e a conferência de páginas são feitas por revisor separado do autor da etapa — regra de contrato, não cortesia."
          - listitem [ref=e224]: "• As pessoas mandam nos pontos decisivos: o professor Fábio define o objetivo e dá o retorno final sobre cada peça; exceções a qualquer trava exigem autorização nomeada; para entrega em regime estrito, o protocolo exige confirmação humana assinada."
          - listitem [ref=e225]: "• O retorno humano é a matéria-prima mais valiosa: as correções feitas na versão protocolada viram lições registradas que melhoram o molde dos próximos casos."
      - generic [ref=e226]:
        - heading "O que nunca acontece sozinho" [level=3] [ref=e229]
        - list [ref=e230]:
          - listitem [ref=e231]: • Nenhuma petição real é alterada automaticamente pelo ciclo de melhoria — a versão vencedora só vira molde para casos futuros.
          - listitem [ref=e232]: • Nenhum fato, número, data, citação ou pedido muda depois da auditoria; a revisão final só toca na forma da escrita.
          - listitem [ref=e233]: "• Nenhum segredo de cliente sai da área privada: as lições são padrões gerais, nunca conteúdo identificável; senhas e chaves de acesso jamais entram em documento."
          - listitem [ref=e234]: • Nenhuma imagem criada por inteligência artificial retrata fatos, pessoas ou provas em peça que vai ao tribunal.
          - listitem [ref=e235]: "• Nenhuma exceção é silenciosa: pular uma trava exige autorização com nome e justificativa, e o registro final lista todas as exceções concedidas."
      - generic [ref=e236]:
        - heading "A escola da fábrica — como a melhoria contínua funciona" [level=3] [ref=e239]
        - list [ref=e240]:
          - listitem [ref=e241]: "• Matéria-prima: as lições das entregas e os registros dos casos, guardados em área privada."
          - listitem [ref=e242]: • A régua de nota é fixada antes de criar as versões — ninguém ajusta o critério depois de ver o resultado.
          - listitem [ref=e243]: • As versões são testadas em ambiente separado, com casos-modelo; a produção viva nunca é tocada.
          - listitem [ref=e244]: "• Empate de nota se resolve pela honestidade do desenho: vence a versão que mostra o conteúdo, não a que esconde texto só para pontuar."
          - listitem [ref=e245]: "• Resultado real já obtido: o mapa desta fábrica subiu da nota 92,8 para 100 em três rodadas de teste, com cópia de segurança e registro de cada passo."
      - generic [ref=e246]:
        - heading "Correspondência técnica — único lugar com códigos, para quem for aos documentos internos" [level=3] [ref=e249]
        - list [ref=e250]:
          - listitem [ref=e251]: "• Etapas: chegada do caso = F0 · leitura protegida = F1 · cem perguntas = F2 e F2-A · fatos e tribunal = F3 · conselho = F4 · fontes oficiais = F5 · redação = F6 · auditoria = F7 · revisão da escrita = F7-B · conferência de páginas = F8 · pacote = F9 · entrega e lições = F10."
          - listitem [ref=e252]: "• Gravidade de erro: erro grave que trava tudo = P0 · apontamento que segue com ressalva destacada = P1."
          - listitem [ref=e253]: • Selo de integridade = impressão digital única do arquivo (chamada de hash), que prova que nada mudou depois da conferência.
          - listitem [ref=e254]: • Os guardiões correspondem aos programas internos de varredura de texto malicioso, exploração de perguntas, conferência de citações, fidelidade editorial, inspeção do documento e comparação pós-entrega.
          - listitem [ref=e255]: • O ciclo de melhoria corresponde ao experimento AutoResearch, registrado com regras, diário de notas e vencedores por rodada em pasta própria.

          - generic: "A redação é feita por inteligência artificial no molde visual do escritório, em voz humana e natural. Cada argumento carrega sua origem: fato dos autos, lei ou julgado. Pessoas e entidades citadas precisam ser reais e localizáveis."
        - button "Focus Auditoria de fatos e citações, Revisor separado confere tudo e simula o adversário., Redação, auditoria e revisão" [ref=f2e116] [cursor=pointer]:

    - generic [ref=f2e206]:
      - generic [ref=f2e207]:
        - heading "O que mudou em 23/07/2026 — a onda de complementação executada e provada" [level=3] [ref=f2e210]
        - list [ref=f2e211]:
          - listitem [ref=f2e212]: "• Cobertura de nota saltou de 8,76% para 100%: os 33.591 processos do acervo foram classificados num único lote retomável, com zero falhas e preservação dos 2.155 scores que têm documento verificado."
          - listitem [ref=f2e213]: "• Nasceu o comando de destino declarado (triagem): todo caso sem nota recebe grupo e motivo gravados, e a saúde do sistema passa a soar alarme se a soma dos destinos não fechar o acervo inteiro."
          - listitem [ref=f2e214]: "• A fila de revisão humana virou pacote de uma sentada: ordenada pelo valor, com sessão identificada e medição de minutos por decisão — sem jamais sugerir ou pré-preencher a decisão."
          - listitem [ref=f2e215]: "• A operação ganhou relógio: quatro rotinas registradas no Agendador do Windows (vigias diários, saúde diária, sanções semanais, backup com ensaio semanal), com registro de cada execução."
          - listitem [ref=f2e216]: "• Os vigias ganharam memória: cada verificação de fonte externa vira linha numa série histórica, que vai escolher a melhor janela de coleta da fonte nacional intermitente."
          - listitem [ref=f2e217]: • A saúde ganhou cinco alarmes automáticos, cada um com teste de simulação próprio e ação de runbook definida.
          - listitem [ref=f2e218]: • Tudo isso entrou por três migrações pequenas de banco (versões 5, 6 e 7), cada uma aplicada somente após cópia de segurança validada, com a suíte de testes inteira verde antes e depois.
      - generic [ref=f2e219]:
        - heading "Os números atuais — fotografia da noite de 23/07/2026" [level=3] [ref=f2e222]
        - list [ref=f2e223]:
          - listitem [ref=f2e224]: • 33.591 processos no acervo — todos com nota de chance de reversão e destino declarado (100%).
          - listitem [ref=f2e225]: • 2.155 documentos com selo digital e linhagem — 100% do corpus documental conferido.
          - listitem [ref=f2e226]: • 8.477 partes registradas com evidência de origem e 32.619 registros no espelho de sanções federais.
          - listitem [ref=f2e227]: • 72 decisões de alto valor aguardando revisor humano — o pacote de revisão está pronto; falta a sessão.
          - listitem [ref=f2e228]: • Banco na versão 7 de esquema, íntegro (verificação ok, zero violações de chave, evidência e proveniência).
          - listitem [ref=f2e229]: "• Primeira série dos vigias gravada: 3 de 5 fontes prontas; a consulta nacional do CNJ estourou o tempo — exatamente a intermitência que a janela de coleta vai contornar."
      - generic [ref=f2e230]:
        - heading "As travas — onde o sistema para sozinho" [level=3] [ref=f2e233]
        - list [ref=f2e234]:
          - listitem [ref=f2e235]: • Fonte paga sem autorização expressa ou sem estimativa dentro do teto → a chamada é bloqueada antes de sair do computador.
          - listitem [ref=f2e236]: • Pedido de leitura com banco ausente → falha na hora, em vez de criar silenciosamente um banco vazio e responder que não há nada.
          - listitem [ref=f2e237]: • Dois processos tentando gravar ao mesmo tempo → apenas um escreve; o outro espera, para o acervo nunca se corromper.
          - listitem [ref=f2e238]: • Caso de alto valor sem decisão de revisor humano identificado → permanece na fila; nenhum programa pode fechá-lo.
          - listitem [ref=f2e239]: • Nova coleta encontra versão mais fraca de uma prova já confirmada → a versão forte é preservada; evidência nunca é rebaixada.
          - listitem [ref=f2e240]: • Caso sem nota e sem destino declarado → alarme de triagem incompleta até o comando fechar a soma do acervo.
          - listitem [ref=f2e241]: • Cópia de segurança sem ensaio real de restauração aprovado → o pacote não é promovido a backup válido.
          - listitem [ref=f2e242]: • A fábrica de petições pede mudança no acervo → além do pedido, precisa apresentar autorização externa própria.
      - generic [ref=f2e243]:
        - heading "Quem faz o quê — pessoas, agentes e o relógio" [level=3] [ref=f2e246]
        - list [ref=f2e247]:
          - listitem [ref=f2e248]: "• O operador humano usa o balcão de comandos: 29 pedidos possíveis, cada um com nome, descrição e resultado previsível."
          - listitem [ref=f2e249]: "• A fábrica de petições e outros agentes usam o balcão de dados: 31 ações de lista fechada com envelope padronizado — jamais comandos livres."
          - listitem [ref=f2e250]: "• O relógio do Windows aciona os mesmos balcões, nas janelas combinadas — a automação não tem porta secreta: usa exatamente os comandos que uma pessoa usaria."
          - listitem [ref=f2e251]: "• O revisor humano é insubstituível no ponto mais sensível: promover caso de alto valor exige nome, documento com selo coerente e trecho literal da decisão — e agora o tempo de cada decisão é medido para melhorar o pacote, nunca para pressionar a decisão."
          - listitem [ref=f2e252]: "• O sistema declara os próprios limites: ausência de resultado nunca é tratada como prova de que algo não existe juridicamente."
      - generic [ref=f2e253]:
        - heading "O relógio da fábrica — o que roda sozinho e quando" [level=3] [ref=f2e256]
        - list [ref=f2e257]:
          - listitem [ref=f2e258]: "• Todo dia 07h00 — vigias das fontes externas: cada resultado vira linha da série histórica e arquivo de estado para a saúde."
          - listitem [ref=f2e259]: "• Todo dia 07h15 — saúde consolidada: integridade, cobertura, triagem e os cinco alarmes; só o desvio merece atenção humana."
          - listitem [ref=f2e260]: • Toda segunda 07h30 — atualização do espelho de sanções federais, com data de referência e selos.
          - listitem [ref=f2e261]: • Todo domingo 08h00 — cópia de segurança completa com manifesto e ensaio real de restauração; sem ensaio aprovado, não é backup.
          - listitem [ref=f2e262]: "• Lotes manuais (classificação, coleta) respeitam a janela: nunca antes das 09h — o escritor único do banco é a proteção dura; a janela é higiene."
          - listitem [ref=f2e263]: • Cada execução deixa registro datado; as rotinas são removíveis a qualquer momento sem tocar no sistema.
      - generic [ref=f2e264]:
        - heading "O que ainda depende de pessoa ou de tempo — pendências honestas" [level=3] [ref=f2e267]
        - list [ref=f2e268]:
          - listitem [ref=f2e269]: • As 72 decisões de alto valor esperam sessões de revisão humana — por regra inviolável, nenhum programa pode fechá-las; a meta é zerar em até 6 sessões e a mediana de minutos por decisão nasce na primeira.
          - listitem [ref=f2e270]: • A consulta nacional do CNJ segue intermitente; a série dos vigias precisa de cerca de uma semana para apontar a melhor janela de coleta com base em dados, não em palpite.
          - listitem [ref=f2e271]: "• Da refatoração estrutural anterior, continuam pendentes: a varredura externa de segurança do código (ainda não iniciada), as metas de cobertura de testes, a medição de desempenho e a prova final de operação de ponta a ponta."
          - listitem [ref=f2e272]: "• Limites assumidos por decisão, não por falha: um computador e um escritor por vez; banco maior, nova interface e automação das 72 revisões ficam fora até haver gatilho medido."
          - listitem [ref=f2e273]: • Os avanços de 23/07 estão gravados no controle de versão local; o envio ao repositório remoto aguarda ordem expressa.
      - generic [ref=f2e274]:
        - heading "Correspondência técnica — único lugar com códigos, para quem for aos documentos internos" [level=3] [ref=f2e277]
        - list [ref=f2e278]:
          - listitem [ref=f2e279]: "• O sistema é o pacote Python TeiaJus com banco SQLite (teiajus.db, esquema versão 7); balcões: CLI `python -m teiajus` (29 subcomandos) e API JSON v1 (31 ações em allowlist)."
          - listitem [ref=f2e280]: "• As novidades de 23/07 no banco: migração 5 = tabela case_triage (destino declarado); migração 6 = colunas presented_at/session_id na fila de revisão; migração 7 = tabela canary_history (série dos vigias)."
          - listitem [ref=f2e281]: "• Comandos novos e enriquecidos: `triagem` (destino declarado), `canarios` (agora grava história), `saude` (blocos triage/canaryHistory/alerts), `evidencia-preparar` (sessão e apresentação carimbadas)."
          - listitem [ref=f2e282]: "• Alarmes da saúde: integridade_divergente, triagem_incompleta, fonte_caida:<fonte>, backup_vencido, fila_revisao_parada — cada um com fixture em tests/test_vigias_e_alertas.py."
          - listitem [ref=f2e283]: "• Rotinas: pasta \\TeiaJus\\ do Agendador (Vigias, Saúde, CGU, Backup) chamando executar_manutencao.ps1; runbook em teiajus/OPERACAO_MANUTENCAO_AGENDADA.md."
          - listitem [ref=f2e284]: • Selo digital = hash SHA-256; regras de gravação = WAL, chaves estrangeiras e trava de escritor único entre processos.

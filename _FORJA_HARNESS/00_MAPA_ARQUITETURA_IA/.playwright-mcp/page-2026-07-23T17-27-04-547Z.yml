    - generic [ref=f1e188]:
      - generic [ref=f1e189]:
        - heading "Os guardiões automáticos — programas reais que vigiam cada etapa" [level=3] [ref=f1e192]
        - list [ref=f1e193]:
          - listitem [ref=f1e194]: "• Caçador de texto malicioso (na leitura dos documentos): procura letras invisíveis, fonte minúscula e frases que tentem dar ordens à inteligência artificial; qualquer achado para a linha e vai para triagem humana."
          - listitem [ref=f1e195]: "• Explorador de cem perguntas: garante que o caso foi examinado por dez ângulos — objetivo do cliente, caminho processual, fatos e provas, leis aplicáveis, repercussão, riscos, prazos, tendência dos julgadores, argumentos do adversário e blindagem contra recursos."
          - listitem [ref=f1e196]: "• Conferente de citações: compara cada lei, súmula e decisão citada, palavra por palavra, com a fonte oficial, arquivada com a data da conferência."
          - listitem [ref=f1e197]: "• Contador duplo de prazos: o mesmo prazo é contado duas vezes, por conferentes separados; divergência precisa ser resolvida e registrada por escrito antes de liberar a peça."
          - listitem [ref=f1e198]: "• Simulador do adversário: nove objeções respondidas por escrito antes de liberar — a nona pergunta se a peça aceitou premissa que os autos não sustentam."
          - listitem [ref=f1e199]: "• Conferente de fidelidade da revisão final: compara o texto antes e depois da revisão de escrita; se número, data, citação, pedido ou ressalva mudou, a versão é descartada e refeita."
          - listitem [ref=f1e200]: "• Inspetor do documento final: procura campos esquecidos (como um nome entre colchetes), texto invisível e vestígios técnicos escondidos nos bastidores do arquivo; confere que a aparência segue o padrão do escritório."
          - listitem [ref=f1e201]: "• Comparador pós-entrega: mede as diferenças entre a versão que enviamos e a que foi protocolada, e transforma cada diferença em lição registrada para os próximos casos."
      - generic [ref=f1e202]:
        - heading "Onde o sistema trava sozinho — e o que destrava" [level=3] [ref=f1e205]
        - list [ref=f1e206]:
          - listitem [ref=f1e207]: • Falta prova para um fato essencial → a redação não começa; a pendência vira pedido de diligência com responsável nomeado.
          - listitem [ref=f1e208]: • Citação não confere com a fonte oficial → é corrigida, transformada em paráfrase declarada ou retirada antes de seguir.
          - listitem [ref=f1e209]: • A auditoria encontra um erro grave (fato alterado, citação falsa, autoridade trocada, pedido faltando) → a peça volta; só segue com zero erros graves comprovados.
          - listitem [ref=f1e210]: • A revisão de escrita tocou no conteúdo → a versão é descartada e refeita a partir do texto auditado, quantas vezes for preciso.
          - listitem [ref=f1e211]: • Página com defeito visual ou campo esquecido → a entrega espera a correção e uma nova inspeção completa de todas as páginas.
          - listitem [ref=f1e212]: • Sem prova de entrega e sem o painel de demandas atualizado → o caso não fecha e a demanda continua aberta.
      - generic [ref=f1e213]:
        - heading "Quem faz o quê — pessoas e inteligências artificiais, sem disfarce" [level=3] [ref=f1e216]
        - list [ref=f1e217]:
          - listitem [ref=f1e218]: "• A inteligência artificial faz o trabalho pesado: lê os autos, pesquisa fontes, redige a minuta, audita citações e inspeciona páginas — sempre dentro de trilhos, com registro de cada passo."
          - listitem [ref=f1e219]: • Helena e Cícero são conselheiros de inteligência artificial especializados (estratégia e direito). Os pareceres deles são escritos e obrigatórios; cada recomendação recebe resposta registrada — acatada ou rejeitada e por quê.
          - listitem [ref=f1e220]: "• Quem produz nunca é quem revisa: a auditoria e a conferência de páginas são feitas por revisor separado do autor da etapa — regra de contrato, não cortesia."
          - listitem [ref=f1e221]: "• As pessoas mandam nos pontos decisivos: o professor Fábio define o objetivo e dá o retorno final sobre cada peça; exceções a qualquer trava exigem autorização nomeada; para entrega em regime estrito, o protocolo exige confirmação humana assinada."
          - listitem [ref=f1e222]: "• O retorno humano é a matéria-prima mais valiosa: as correções feitas na versão protocolada viram lições registradas que melhoram o molde dos próximos casos."
      - generic [ref=f1e223]:
        - heading "O que nunca acontece sozinho" [level=3] [ref=f1e226]
        - list [ref=f1e227]:
          - listitem [ref=f1e228]: • Nenhuma petição real é alterada automaticamente pelo ciclo de melhoria — a versão vencedora só vira molde para casos futuros.
          - listitem [ref=f1e229]: • Nenhum fato, número, data, citação ou pedido muda depois da auditoria; a revisão final só toca na forma da escrita.
          - listitem [ref=f1e230]: "• Nenhum segredo de cliente sai da área privada: as lições são padrões gerais, nunca conteúdo identificável; senhas e chaves de acesso jamais entram em documento."
          - listitem [ref=f1e231]: • Nenhuma imagem criada por inteligência artificial retrata fatos, pessoas ou provas em peça que vai ao tribunal.
          - listitem [ref=f1e232]: "• Nenhuma exceção é silenciosa: pular uma trava exige autorização com nome e justificativa, e o registro final lista todas as exceções concedidas."
      - generic [ref=f1e233]:
        - heading "A escola da fábrica — como a melhoria contínua funciona" [level=3] [ref=f1e236]
        - list [ref=f1e237]:
          - listitem [ref=f1e238]: "• Matéria-prima: as lições das entregas e os registros dos casos, guardados em área privada."
          - listitem [ref=f1e239]: • A régua de nota é fixada antes de criar as versões — ninguém ajusta o critério depois de ver o resultado.
          - listitem [ref=f1e240]: • As versões são testadas em ambiente separado, com casos-modelo; a produção viva nunca é tocada.
          - listitem [ref=f1e241]: "• Empate de nota se resolve pela honestidade do desenho: vence a versão que mostra o conteúdo, não a que esconde texto só para pontuar."
          - listitem [ref=f1e242]: "• Resultado real já obtido: o mapa desta fábrica subiu da nota 92,8 para 100 em três rodadas de teste, com cópia de segurança e registro de cada passo."
      - generic [ref=f1e243]:
        - heading "Correspondência técnica — único lugar com códigos, para quem for aos documentos internos" [level=3] [ref=f1e246]
        - list [ref=f1e247]:
          - listitem [ref=f1e248]: "• Etapas: chegada do caso = F0 · leitura protegida = F1 · cem perguntas = F2 e F2-A · fatos e tribunal = F3 · conselho = F4 · fontes oficiais = F5 · redação = F6 · auditoria = F7 · revisão da escrita = F7-B · conferência de páginas = F8 · pacote = F9 · entrega e lições = F10."
          - listitem [ref=f1e249]: "• Gravidade de erro: erro grave que trava tudo = P0 · apontamento que segue com ressalva destacada = P1."
          - listitem [ref=f1e250]: • Selo de integridade = impressão digital única do arquivo (chamada de hash), que prova que nada mudou depois da conferência.
          - listitem [ref=f1e251]: • Os guardiões correspondem aos programas internos de varredura de texto malicioso, exploração de perguntas, conferência de citações, fidelidade editorial, inspeção do documento e comparação pós-entrega.
          - listitem [ref=f1e252]: • O ciclo de melhoria corresponde ao experimento AutoResearch, registrado com regras, diário de notas e vencedores por rodada em pasta própria.
